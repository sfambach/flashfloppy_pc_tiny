# FlashFloppy PC Tiny - Mini Floppy Emulator, IBM PC
# Copy to the root of the USB stick (FAT32), jumper S1.

## Drive
interface = ibmpc
host = pc-dos

## Display: SSD1306/SH1106 OLED 128x32 (I2C 0x3C/0x3D)
# Add -rotate to turn the view 180 degrees, -slow if the OLED blanks.
display-type = oled-128x32
oled-font = 6x13
oled-contrast = 143

## Buttons: left / right / select (3 buttons, no rotary encoder)
# Hold select on an image to open the eject menu (copy/paste/delete).
